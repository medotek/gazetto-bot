<svg viewBox="0 0 130 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <!-- Clin d'œil « this is fine » : silhouette redessinée à la main (chapeau,
       museau de profil, oreille tombante) plutôt que l'image d'origine.
       Le groupe .front repasse des flammes devant pour l'asseoir dans le feu. -->
  <g stroke="#141414" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- pattes arrière -->
    <path d="M52 118 q-4 12 6 14 q10 2 12 -8" fill="#c8843a"/>
    <path d="M72 120 q0 12 10 12 q10 0 10 -10" fill="#c8843a"/>

    <!-- corps en haricot -->
    <path d="M44 52 q-10 34 -2 54 q8 20 30 18 q20 -2 22 -22 q2 -24 -8 -44 z" fill="#c8843a"/>

    <!-- patte avant repliée -->
    <path d="M56 92 q-2 18 10 20" fill="none"/>

    <!-- oreille tombante -->
    <path d="M46 40 q-16 4 -14 26 q2 20 16 18 q6 -18 4 -42 z" fill="#141414"/>

    <!-- tête -->
    <path d="M46 30 q22 -10 38 8 q10 12 8 26 q-2 16 -20 18 q-22 2 -28 -14 q-6 -22 2 -38 z" fill="#c8843a"/>

    <!-- museau de profil -->
    <path d="M84 56 q18 -6 26 6 q6 10 -4 15 q-14 6 -24 -3 z" fill="#c8843a"/>
    <ellipse cx="105" cy="62" rx="13" ry="10" fill="#2b2b2b"/>
    <!-- sourire imperturbable -->
    <path d="M80 71 q7 8 14 1" fill="none"/>

    <!-- yeux grands ouverts, sereins -->
    <ellipse cx="61" cy="50" rx="13" ry="15" fill="#ffffff"/>
    <ellipse cx="86" cy="43" rx="12" ry="14" fill="#ffffff"/>
    <ellipse cx="61" cy="52" rx="7" ry="8" fill="#141414" stroke="none"/>
    <ellipse cx="87" cy="45" rx="7" ry="8" fill="#141414" stroke="none"/>

    <!-- chapeau -->
    <path d="M44 26 q6 -20 24 -18 q16 2 14 18 z" fill="#e09a34"/>
    <path d="M32 27 q18 -8 46 -4 q14 2 12 8 q-4 6 -28 4 q-24 -2 -30 -8 z" fill="#e09a34"/>
  </g>

  <!-- flammes au premier plan -->
  <g class="front">
    <path d="M2 148 q8 -40 18 -21 q6 -30 15 -8 q7 -16 10 29 z" fill="#e8531f" opacity=".95"/>
    <path d="M9 148 q6 -24 12 -13 q4 -17 9 13 z" fill="#f7a531"/>
    <path d="M96 148 q10 -44 21 -23 q7 -32 11 6 q4 12 2 17 z" fill="#e8531f" opacity=".95"/>
    <path d="M104 148 q7 -26 13 -14 q4 -18 6 14 z" fill="#f7a531"/>
    <path d="M52 148 q6 -18 11 -8 q4 -12 6 8 z" fill="#e8531f" opacity=".85"/>
  </g>
</svg>
